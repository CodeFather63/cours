site_name: Ressources Lycée Fénelon

theme:
  name: material
  language: fr
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest

extra_css:
  - stylesheets/extra.css

nav:
  - Accueil: index.md

  - Maths en Première:
      - Cahier de texte: maths_premiere/index.md
      - Cours : maths_premiere/Cours/index.md

  - Maths en Terminale:
      - Cahier de texte: maths_terminale/index.md
      - Cours : maths_terminale/Cours/index.md
      
      
  - NSI:
      - Première:
          - Cahier de texte: nsi_premiere/index.md
          - Cours: nsi_premiere/ressources/index.md
          - Défis: nsi_premiere/defis/index.md
          - Épreuve pratique: nsi_premiere/epreuve_pratique/index.md
          - Sujets 2026_2027: nsi_premiere/sujets/index.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
